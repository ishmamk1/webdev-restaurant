<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ishmam's Pizzaria</title>
<link rel="stylesheet" href="css/style.css">
<script defer src="js/script.js"></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Restaurant Logo" class="logo-img">
        </div>
        <div class="logo">Ishmam's Pizzaria</div>
        <nav id="nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html" class="cart-link">Your Cart</a>
        </nav>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>


<section class="hero">

    <div class="hero-content">
        <h1>Welcome to Ishmam's Pizzaria</h1>
        <p>Fresh ingredients. Authentic flavor. The best pizza in town.</p>
        <a href="menu.html" class="hero-btn">View Our Menu</a>
    </div>

    <div class="hero-image">
        <img src="images/hero-image.jpg" alt="Pizza">
    </div>

</section>
<br>
<br>


<section class="gallery">

    <h2>Our Pizza Gallery</h2>
    
    <div class="gallery-slider">
    
    <button class="slide-btn prev" onclick="changeSlide(-1)">❮</button>
    
    <div class="slides">
    
    <img src="images/pizza1.jpg" class="slide active">
    <img src="images/pizza2.jpg" class="slide">
    <img src="images/pizza3.jpg" class="slide">
    <img src="images/pizza4.jpg" class="slide">
    <img src="images/pizza5.jpg" class="slide">
    <img src="images/pizza6.jpg" class="slide">
    
    </div>
    
    <button class="slide-btn next" onclick="changeSlide(1)">❯</button>
    
    </div>
    
    </section>


<footer>

<p>Open Hours: Mon–Sun 10AM–10PM</p>

<div class="social">
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Twitter</a>
</div>

</footer>

</body>
</html>
