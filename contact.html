<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Ishmam's Pizzaria</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<div class="logo-container">
<img src="images/logo.png" alt="Restaurant Logo" class="logo-img">
<div class="logo">Ishmam's Pizzaria</div>
</div>

<nav id="nav">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="hamburger" onclick="toggleMenu()">☰</div>

</header>


<main>

<section class="contact">

<h1>Contact Us</h1>
<p class="contact-subtitle">We'd love to hear from you!</p>

<div class="contact-container">

<div class="contact-form">

<form>

<label>Name</label>
<input type="text" placeholder="Your Name" required>

<label>Email</label>
<input type="email" placeholder="Your Email" required>

<label>Message</label>
<textarea placeholder="Your Message" rows="5" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>


<div class="contact-map">

<iframe
src="https://www.google.com/maps?q=New+York&output=embed"
width="100%"
height="350"
style="border:0;"
allowfullscreen
loading="lazy">
</iframe>

</div>

</div>

</section>

</main>


<footer>

<p>Open Hours: Mon–Sun 10AM–10PM</p>

<div class="social">
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Twitter</a>
</div>

</footer>


</body>
</html>
