<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu | Ishmam's Pizzaria</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<div class="logo-container">
<img src="images/logo.png" alt="Restaurant Logo" class="logo-img">
<div class="logo">Ishmam's Pizzaria</div>
</div>

<nav id="nav">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="hamburger" onclick="toggleMenu()">☰</div>

</header>


<main>

<section class="menu">

<h1>Our Pizza Menu</h1>

<div class="menu-container">

<div class="menu-card">
<img src="images/pizza1.jpg" alt="Margherita Pizza">
<h3>Margherita Pizza</h3>
<p class="price">$12</p>
</div>

<div class="menu-card">
<img src="images/pizza2.jpg" alt="Pepperoni Pizza">
<h3>Pepperoni Pizza</h3>
<p class="price">$14</p>
</div>

<div class="menu-card">
<img src="images/pizza3.jpg" alt="BBQ Chicken Pizza">
<h3>BBQ Chicken Pizza</h3>
<p class="price">$15</p>
</div>

<div class="menu-card">
<img src="images/pizza4.jpg" alt="Veggie Pizza">
<h3>Veggie Pizza</h3>
<p class="price">$13</p>
</div>

</div>

</section>

</main>


<footer>

<p>Open Hours: Mon–Sun 10AM–10PM</p>

<div class="social">
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Twitter</a>
</div>

</footer>


<script>
function toggleMenu(){
let nav = document.getElementById("nav");

if(nav.style.display === "flex"){
    nav.style.display = "none";
} else{
    nav.style.display = "flex";
}
}
</script>

</body>
</html>
